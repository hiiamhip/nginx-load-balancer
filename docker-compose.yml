version: "3.8"
services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - backend_network
  app1:
    build: .
    environment:
      - APP_NAME=App1
    networks:
      - backend_network

  app2:
    build: .
    environment:
      - APP_NAME=App2
    networks:
      - backend_network

  app3:
    build: .
    environment:
      - APP_NAME=App3
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge
